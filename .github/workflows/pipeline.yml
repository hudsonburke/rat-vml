name: Analysis Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'chapters/**'
      - 'pyproject.toml'
      - '.github/workflows/pipeline.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      session:
        description: 'Session to analyze (e.g. baseline, week24)'
        required: false
        default: 'week24'
      model_ref:
        description: 'Git ref for rat-hindlimb-model (branch or tag)'
        required: false
        default: 'main'

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'

jobs:
  # ----------------------------------------------------------------
  # Job 1: Validate project structure and imports
  # ----------------------------------------------------------------
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Validate subject groups
        run: |
          uv run python -c "
          from rat_vml.analysis.subject_groups import SUBJECT_TO_GROUP
          print(f'Subject groups loaded: {len(SUBJECT_TO_GROUP)} subjects')
          assert len(SUBJECT_TO_GROUP) > 50, f'Expected 50+ subjects, got {len(SUBJECT_TO_GROUP)}'
          print('Subject groups validated')
          "

      - name: Validate analysis imports
        run: |
          uv run python -c "
          from rat_vml.analysis.parquet_catalog import ParquetCatalog
          from rat_vml.analysis.parquet_io import parquet_to_trc, parquet_to_fp_mot
          from rat_vml.analysis.results_storage import store_ik_result, store_id_result, store_moco_result
          from rat_vml.analysis.aggregation import load_results, aggregate_by_group, compare_groups
          print('All analysis module imports validated')
          "

  # ----------------------------------------------------------------
  # Job 2: Download Parquet data from HF + validate
  # ----------------------------------------------------------------
  data:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Cache Parquet data
        uses: actions/cache@v4
        id: cache-parquet
        with:
          path: data/processed
          key: parquet-data-${{ hashFiles('.github/workflows/pipeline.yml') }}
          restore-keys: parquet-data-

      - name: Download Parquet from HuggingFace
        if: steps.cache-parquet.outputs.cache-hit != 'true'
        run: |
          uv run python -c "
          from huggingface_hub import snapshot_download

          path = snapshot_download(
              'hudsonburke/rat-hindlimb-mocap',
              repo_type='dataset',
              local_dir='data/processed',
              allow_patterns=['processed/**/*.parquet'],
          )
          print(f'Downloaded to {path}')
          "

      - name: Validate Parquet data
        run: |
          uv run python -c "
          from pathlib import Path
          import polars as pl

          data_dir = Path('data/processed')
          if not data_dir.exists():
              print('WARNING: No data directory, skipping validation')
              exit(0)

          subjects = [d for d in data_dir.iterdir() if d.is_dir()]
          print(f'Found {len(subjects)} subject directories')

          for subject_dir in sorted(subjects)[:3]:
              markers = subject_dir / 'markers.parquet'
              if markers.exists():
                  df = pl.read_parquet(markers)
                  print(f'  {subject_dir.name}: {df.shape[0]} marker rows, {df[\"session_id\"].unique().to_list()[:3]} sessions')
          "

      - name: Upload Parquet data
        uses: actions/upload-artifact@v4
        with:
          name: parquet-data
          path: data/processed/
          if-no-files-found: ignore
          retention-days: 7

  # ----------------------------------------------------------------
  # Job 3: Run pipeline (manual dispatch)
  # ----------------------------------------------------------------
  analysis:
    needs: data
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Download model
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MODEL_REF=${{ github.event.inputs.model_ref || 'main' }}
          git clone --depth=1 -b "$MODEL_REF" \
            https://github.com/hudsonburke/rat-hindlimb-model.git \
            /tmp/model
          ls /tmp/model/models/osim/rat_hindlimb_bilateral.osim

      - name: Download Parquet data
        uses: actions/download-artifact@v4
        with:
          name: parquet-data
          path: data/processed/

      - name: Run IK pipeline
        run: |
          SESSION=${{ github.event.inputs.session || 'baseline' }}
          uv run python scripts/run_ik.py \
            --data-dir data/processed \
            --subject BAA01 \
            --session $SESSION \
            --trial Walk01 \
            --model /tmp/model/models/osim/rat_hindlimb_bilateral.osim \
            2>&1 | tee ik.log

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-results
          path: |
            data/processed/
            ik.log
          if-no-files-found: ignore

  # ----------------------------------------------------------------
  # Job 4: Render manuscript
  # ----------------------------------------------------------------
  render:
    needs: [validate]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render manuscript
        run: quarto render

      - name: Upload rendered manuscript
        uses: actions/upload-artifact@v4
        with:
          name: manuscript
          path: _site/
          if-no-files-found: ignore
