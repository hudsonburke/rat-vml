# DVC pipeline parameters for rat-vml analysis
# Mirrors osimpy settings where applicable

rotation_matrix: [[1, 0, 0], [0, 0, 1], [0, -1, 0]]

required_markers:
  - "TAIL"
  - "SPL6"
  - "LASI"
  - "RASI"
  - "LHIP"
  - "LKNE"
  - "LANK"
  - "LTOE"
  - "RHIP"
  - "RKNE"
  - "RANK"
  - "RTOE"

scaling_parameters:
  - "Mass"
  - "Length"
  - "RFemurLength"
  - "RTibiaLength"
  - "RFootLength"
  - "LFemurLength"
  - "LTibiaLength"
  - "LFootLength"

event_sequences:
  - name: "left_stance_swing"
    events:
      - context: "Left"
        label: "Foot Strike"
      - context: "Right"
        label: "Foot Off"
      - context: "Right"
        label: "Foot Strike"
      - context: "Left"
        label: "Foot Off"
      - context: "Left"
        label: "Foot Strike"
      - context: "Right"
        label: "Foot Off"
      - context: "Right"
        label: "Foot Strike"
  - name: "right_stance_swing"
    events:
      - context: "Right"
        label: "Foot Strike"
      - context: "Left"
        label: "Foot Off"
      - context: "Left"
        label: "Foot Strike"
      - context: "Right"
        label: "Foot Off"
      - context: "Right"
        label: "Foot Strike"
      - context: "Left"
        label: "Foot Off"
      - context: "Left"
        label: "Foot Strike"

