# Subject definitions (populated from subjects.csv or Parquet metadata)
subjects: {}

# Valid trials (populated by catalog query)
trials: {}

# IK parameters (mirrors osimpy.tools.IKSettings)
ik:
  marker_weight: 1.0
  max_iterations: 200
  constraint_weight: null # null = use template default
  accuracy: null # null = use template default
  report_marker_locations: null # null = use template default
  task_set_path: null # null = no task set override

# ID parameters (mirrors osimpy.tools.IDSettings)
id:
  lowpass_cutoff_frequency: 15.0
  external_loads_path: null # set per-trial from Parquet extraction


# MocoInverse parameters (mirrors osimpy.moco.inverse.MocoInverseSettings)
