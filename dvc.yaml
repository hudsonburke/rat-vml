# DVC pipeline for rat-vml analysis
# Each stage uses a focused script with clear inputs/outputs

stages:
  # Scale model per subject (side-specific lengths)
  scale:
    foreach: ${subjects}
    do:
      cmd: >-
        python scripts/scale.py
        --data-dir data/processed
        --subject ${item.id}
        --session ${item.session}
        --model ${item.model}
        --output-dir data/results
      deps:
        - scripts/scale.py
        - src/rat_vml/analysis/pipeline.py
        - data/processed/${item.id}/markers.parquet
      outs:
        - data/results/${item.id}/scaled/
      params:
        - subjects.${item.id}.mass
        - subjects.${item.id}.femur_length_l
        - subjects.${item.id}.femur_length_r
        - subjects.${item.id}.tibia_length_l
        - subjects.${item.id}.tibia_length_r

  # IK per trial
  ik:
    foreach: ${trials}
    do:
      cmd: >-
        python scripts/run_ik.py
        --data-dir data/processed
        --subject ${item.subject}
        --session ${item.session}
        --trial ${item.trial}
        --model data/results/${item.subject}/scaled/model.osim
        --output-dir data/results
      deps:
        - scripts/run_ik.py
        - src/rat_vml/analysis/pipeline.py
        - src/rat_vml/analysis/parquet_io.py
        - data/results/${item.subject}/scaled/model.osim
        - data/processed/${item.subject}/markers.parquet
      outs:
        - data/results/${item.subject}/trials/${item.trial}/${item.trial}.trc
        - data/results/${item.subject}/trials/${item.trial}/${item.subject}_${item.trial}_ik.mot
      params:
        - ik.marker_weight
        - ik.max_iterations

  # ID per trial
  id:
    foreach: ${trials}
    do:
      cmd: >-
        python scripts/run_id.py
        --data-dir data/processed
        --subject ${item.subject}
        --session ${item.session}
        --trial ${item.trial}
        --model data/results/${item.subject}/scaled/model.osim
        --ik-file data/results/${item.subject}/trials/${item.trial}/${item.subject}_${item.trial}_ik.mot
        --output-dir data/results
      deps:
        - scripts/run_id.py
        - src/rat_vml/analysis/pipeline.py
        - src/rat_vml/analysis/parquet_io.py
        - data/results/${item.subject}/scaled/model.osim
        - data/results/${item.subject}/trials/${item.trial}/${item.subject}_${item.trial}_ik.mot
        - data/processed/${item.subject}/forceplates.parquet
      outs:
        - data/results/${item.subject}/trials/${item.trial}/${item.trial}_forces.mot
        - data/results/${item.subject}/trials/${item.trial}/${item.trial}_ext_loads.xml
        - data/results/${item.subject}/trials/${item.trial}/${item.subject}_${item.trial}_id.sto
      params:
        - id.cutoff_freq

  # MocoInverse per trial
  moco:
    foreach: ${trials}
    do:
      cmd: >-
        python scripts/run_moco.py
        --subject ${item.subject}
        --trial ${item.trial}
        --model data/results/${item.subject}/scaled/model.osim
        --ik-file data/results/${item.subject}/trials/${item.trial}/${item.subject}_${item.trial}_ik.mot
        --ext-loads data/results/${item.subject}/trials/${item.trial}/${item.trial}_ext_loads.xml
        --output-dir data/results
      deps:
        - scripts/run_moco.py
        - src/rat_vml/analysis/pipeline.py
        - data/results/${item.subject}/scaled/model.osim
        - data/results/${item.subject}/trials/${item.trial}/${item.subject}_${item.trial}_ik.mot
        - data/results/${item.subject}/trials/${item.trial}/${item.trial}_ext_loads.xml
      outs:
        - data/results/${item.subject}/trials/${item.trial}/${item.subject}_${item.trial}_moco.sto
      params:
        - moco.mesh_interval
        - moco.replace_muscles_with_dgf
        - moco.reserve_optimal_force

  # Aggregate group results
  aggregate:
    cmd: python scripts/aggregate.py --results-dir data/results --output-dir data/aggregate
    deps:
      - scripts/aggregate.py
      - src/rat_vml/analysis/pipeline.py
      - data/results/
    outs:
      - data/aggregate/

  # Plot figures
  plot:
    cmd: python scripts/plot.py --aggregate-dir data/aggregate --output-dir data/figures
    deps:
      - scripts/plot.py
      - src/rat_vml/analysis/plots.py
      - data/aggregate/
    outs:
      - data/figures/
