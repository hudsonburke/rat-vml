# DVC pipeline for rat-vml analysis
# Each stage calls osimpy tools directly via focused scripts
# Data flow: Parquet → TRC/MOT → osimpy → results → Parquet

stages:
  # Scale model per subject
  scale:
    foreach: ${subjects}
    do:
      cmd: >-
        python scripts/scale.py
        --data-dir data/processed
        --subject ${item.id}
        --session ${item.session}
        --model ${item.model}
        --output-dir data/processed
      deps:
        - scripts/scale.py
        - data/processed/${item.id}/markers.parquet
      outs:
        - data/processed/${item.id}/scaled_model.osim
      params:
        - subjects.${item.id}.mass
        - subjects.${item.id}.femur_length_l
        - subjects.${item.id}.femur_length_r
        - subjects.${item.id}.tibia_length_l
        - subjects.${item.id}.tibia_length_r

  # IK per trial — calls osimpy IKSettings directly
  ik:
    foreach: ${trials}
    do:
      cmd: >-
        python scripts/run_ik.py
        --data-dir data/processed
        --subject ${item.subject}
        --session ${item.session}
        --trial ${item.trial}
        --model data/processed/${item.subject}/scaled_model.osim
        --output-dir data/processed
      deps:
        - scripts/run_ik.py
        - data/processed/${item.subject}/scaled_model.osim
        - data/processed/${item.subject}/markers.parquet
      outs:
        - data/processed/${item.subject}/ik_${item.session}_${item.trial}.mot
      params:
        - ik.marker_weight
        - ik.accuracy
        - ik.constraint_weight

  # ID per trial — calls osimpy IDSettings directly
  id:
    foreach: ${trials}
    do:
      cmd: >-
        python scripts/run_id.py
        --data-dir data/processed
        --subject ${item.subject}
        --session ${item.session}
        --trial ${item.trial}
        --model data/processed/${item.subject}/scaled_model.osim
        --ik-file data/processed/${item.subject}/ik_${item.session}_${item.trial}.mot
        --output-dir data/processed
      deps:
        - scripts/run_id.py
        - data/processed/${item.subject}/scaled_model.osim
        - data/processed/${item.subject}/ik_${item.session}_${item.trial}.mot
        - data/processed/${item.subject}/forceplates.parquet
      outs:
        - data/processed/${item.subject}/id_${item.session}_${item.trial}.sto
      params:
        - id.lowpass_cutoff_frequency

  # MocoInverse per trial — calls osimpy MocoInverseSettings directly
  moco:
    foreach: ${trials}
    do:
      cmd: >-
        python scripts/run_moco.py
        --subject ${item.subject}
        --session ${item.session}
        --trial ${item.trial}
        --model data/processed/${item.subject}/scaled_model.osim
        --ik-file data/processed/${item.subject}/ik_${item.session}_${item.trial}.mot
        --ext-loads data/processed/${item.subject}/ext_loads_${item.session}_${item.trial}.xml
        --output-dir data/processed
      deps:
        - scripts/run_moco.py
        - data/processed/${item.subject}/scaled_model.osim
        - data/processed/${item.subject}/ik_${item.session}_${item.trial}.mot
        - data/processed/${item.subject}/ext_loads_${item.session}_${item.trial}.xml
      outs:
        - data/processed/${item.subject}/moco_${item.session}_${item.trial}.sto
      params:
        - moco.mesh_interval
        - moco.replace_muscles_with_dgf
        - moco.reserve_optimal_force

  # Aggregate group results
  aggregate:
    cmd: python scripts/aggregate.py --data-dir data/processed --output-dir data/aggregate
    deps:
      - scripts/aggregate.py
      - data/processed/
    outs:
      - data/aggregate/

  # Plot figures
  plot:
    cmd: python scripts/plot.py --aggregate-dir data/aggregate --output-dir data/figures
    deps:
      - scripts/plot.py
      - data/aggregate/
    outs:
      - data/figures/
